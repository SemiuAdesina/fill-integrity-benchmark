[metadata]
author_name="Semiu Adesina"
author_email="sadesina893@stu.ui.edu.ng"
category="debugging"
tags=["rust","convex-geometry","halfspaces","rational-arithmetic"]
expert_time_estimate_hours=3.0
difficulty_explanation="""The solver must choose which supplied planes to keep and at which offset, and those choices are coupled: the evidence set contains one family offering a too-tight offset that satisfies no support with equality, and a seventh looser family that is compatible with every visible support yet owns no positive-area facet, so a selection that merely satisfies the supports is still wrong. Support values are exact maxima and must be attained exactly, which forces exact rational arithmetic - a floating-point or epsilon comparison accepts the too-tight plane. Vertices come from triple intersections that coincide at cube corners, so they must be reduced and deduplicated rather than enumerated. One case supplies an open wedge in which every plane owns a genuine positive-area facet, so it can only be rejected on recession and no other rule stands in for boundedness. A further case cuts the cube corner: a selection that drops the only lower bound on z matches every supplied support with fewer planes, and only the recession test and the positive-area facet test stand against it, either one alone; a looser offset of the same cut enlarges the diagonal extent past the support it must attain exactly; and two different bounded selections reach the same minimum facet count, so the lexicographic (family, offset) order is what decides. Several selections satisfy every constraint, so the minimum-facet rule and then the lexicographic (family, offset) order decide which is canonical. This mirrors the work of computational-geometry, CAD, and 3D-reconstruction engineers who must recover a consistent convex body from incomplete exact geometric measurements, and who have to reject reconstructions that are redundant, unbounded, or non-canonical even when they agree with every measurement actually taken."""
solution_explanation="""The starting code selects the first available offset from every family and returns no vertices or faces, so it keeps both the too-tight and the redundant plane and fabricates no geometry. The reference instead enumerates the admissible plane and offset choices, computes each candidate vertex as an exact rational triple intersection, reduces and deduplicates those vertices, and discards any selection whose intersection is empty, lower-dimensional, or admits a recession ray. It then drops any plane that owns no positive-area facet, checks every support is attained exactly by some returned vertex, and among the surviving selections takes the one with the fewest facets, breaking ties by the lexicographic list of (family, offset). Faces are emitted in plane-key order with sorted indices of the vertices lying exactly on that plane."""
verification_explanation="""An isolated verifier owns the model and every expected value. A probe links exactly one allowlisted candidate file, records raw functional values and asserts nothing; a separate judge that never links candidate code derives the expectations itself and is the sole grading authority. Eight cases are graded. `minimum_facets` requires the redundant looser plane to be excluded and the canonical minimum-facet selection returned. `exact_vertices` requires reduced exact rational vertices, so an epsilon or bounding-box substitute fails. `face_incidence` requires complete canonical face-to-vertex incidence with equality treated as inside. `withheld_support` evaluates a support direction never supplied in the input against the returned vertices, so the geometry must be genuinely reconstructed rather than fitted to the visible evidence. `boundedness` supplies an open wedge whose planes all own genuine facets, so it is rejected on recession alone. `compound` combines exact equality, coincident triple intersections, redundancy and canonical ordering in one case. `compound_tie` composes four rules at once - a cheaper support-consistent selection that is unbounded, a looser cut offset owning no positive-area facet, an excluded redundant plane and too-tight offset, and two bounded selections tied at the minimum facet count - and compares the whole reconstruction rather than its shape, so getting the selection right but the geometry wrong still fails. `rational_offset_forces_reduced_coordinates` bounds the body at a height no integer expresses, so every upper vertex divides by a determinant of two and the reconstruction is only canonical after reduction. A negative control proves the pipeline observes an injected defect, and a regression proves success-looking process output cannot determine reward."""
[verifier]
environment_mode="separate"
