difficulty_explanation = """
The persona is an execution services engineer on a market making desk: the person who owns the reconciler sitting between the firm's own order management system and the venue's drop copy feed, and who is paged when the firm's book and the exchange's book disagree by one lot. That work is almost never greenfield. The ledger already exists, it was written by someone who has since left, it compiles, it passes the obvious cases, and it is quietly wrong about the boundary conditions of an at least once feed. The engineer reads the venue's own specification, works out which of several defensible readings the venue actually guarantees, and corrects the engine without disturbing the parts other desks depend on. This task is that job.

The starting repository is not greenfield. The engine sizes legs, submits the pair, cancels near expiry and creates positions with correct arithmetic, and it already holds one attribution record per order it submitted, folds the open order list and the fill feed into that record every cycle, keys corrective orders by client reference, persists a snapshot and restores it on restart. All of it compiles before the candidate edits anything. What is wrong is spread across how the venue's observations are read, how derived quantities are computed, what the engine does with a submission outcome, and what its durable state means once the venue has recycled an identifier.

The candidate is told only that the engine records pairings it should not, sends corrective orders it should not, and leaves exposure open that it should close, and is pointed at the two normative documents. Nothing in the task text, the source comments or the diagnostics says which readings are wrong. The readings the two documents pin down, and which the starting repository gets wrong or a careless correction breaks, include the following. They interact rather than stack.

1. Fill events carry a cumulative quantity and an at least once feed redelivers them, and the open order list reports the same running total from the other side. Folding either in as an increment, or adding one source on top of the other, inflates a leg.

2. Attribution windows are half-open, tested against the venue's own match timestamp rather than the cycle that read the event. Both boundaries are graded, and so is the second on either side of each. The open order list carries no timestamp and is exempt.

3. Quantity is a whole number of base units with no comparison tolerance, and where a quantity is divided the division truncates toward zero. One base unit invented by rounding changes which legs complete and the size of the corrective orders that follow.

4. When the venue nets several of the engine's own orders into one match it reports only the total. Deriving each share means ordering the eligible set by attribution window start, then venue sequence, then order identifier lexicographically, taking truncated proportional shares over the sum of outstanding quantities, and handing the remainder out one base unit at a time in that same order. Container iteration order, the order the venue listed the covered orders in, the largest truncated fraction and the largest order are all available and all wrong. Order identifiers are opaque venue labels whose lexicographic order deliberately contradicts arrival order.

5. The basis is outstanding quantity, not submitted size, and a block closes every tracked order it names, including one the division allocated nothing to. A closed order contributes no outstanding quantity to a later block's basis and no still-working quantity to any residual exposure, and the gap it leaves behind is real.

6. `block_ref` is the venue's idempotency key for a block, and a replayed block that is not deduplicated by it is counted twice.

7. An order missing from the open order list may have filled rather than been withdrawn, so treating absence as certain withdrawal neutralizes against quantity the desk already owns. An order the venue closed by naming it in a block is not in that unknown state; the venue said what happened to it.

8. A lost acknowledgement means the venue may have accepted an order it never named back. The rule applies to every submission the engine makes, an entry leg as much as a corrective order: the client reference is retained, the order counts as working, the retry is made under the same reference so the venue's idempotency resolves it onto the original order, and the attribution window stays the one that opened at the first attempt. A retry under a fresh reference places the same exposure twice; dropping the record forgets an order that may be filling.

9. A corrective order already working at the venue is quantity the desk has committed even though nothing has been attributed to it yet. Sizing the next correction from the attributed quantity alone sends the same exposure twice across consecutive cycles; subtracting a record the venue has since closed under-corrects and leaves the leg short.

10. The venue recycles identifiers once a window has closed, including onto a later order of the engine's own. An observation is therefore resolved by the client reference the engine chose, with the venue identifier usable only inside a window, and durable state keyed by venue identifier, closure and cancellation state included, must not outlive the mandate it belonged to.

11. Window starts, absorbed block references, unacknowledged submissions and the client reference counter all have to be durable. A restart that reopens a window admits an observation from outside the original one; a forgotten block reference counts a block twice; a forgotten unacknowledged entry leg is an order that may fill with nothing tracking it; a reset counter regenerates a reference the venue already knows, and the venue deduplicates it onto an unrelated order.

These rules compose, and that is where the difficulty is. A block's division depends on outstanding quantities that are the residue of an earlier division, so one base unit misplaced in the first block changes the basis of the second, which changes which legs complete and which corrective orders are sent. Three graded lifecycle cases combine rules that no single-rule check reaches: a venue identifier recycled onto a later order of the engine's own across a restart; an entry leg whose acknowledgement was lost, which fills at the venue while the feed is withheld, and whose identity must be recovered under its original reference and its original window after a restart; and a block dividing over partly filled corrective orders that allocates two of them nothing, closes all of them, and is delivered again after a restart. Each of those is decided by three or four published rules at once.

The work is long horizon because the failures only reproduce under specific interleavings: a redelivered feed batch, a restart between two cycles, a block that arrives after the order it covers has been partly filled, an acknowledgement that never arrives. The candidate reads the two documents, forms a model of order identity against a cumulative at least once feed, corrects the readings, and interprets the observable failures the six diagnostic suites report, each of which states what the engine did rather than what to change. The task is designed so that no single rewrite of two files settles it: the corrections touch identity resolution, block division, the closure decision, the handling of submission outcomes and the durable state. Mid level Rust engineer familiar with exchange reconciliation: roughly 3 hours. An engineer who has never reconciled an order book against a replaying feed can spend considerably longer.

Four documents ship in the agent image to remove accidental discovery cost rather than difficulty. `/app/spec/source-map.md` maps each concern to the file that owns it and names the entry point; it lists no decision points and says nothing about which reading is wrong. `/app/spec/frozen-contract.md` pins the public surface, says which single type is meant to grow, and states that modules may be added under `src/engine/`. `/app/spec/venue-semantics.md` states the window, division, remainder, finality, idempotency and identifier recycling rules in full. `/app/spec/reconciliation-contract.md` states the engine's side of the same contract: how attribution progress accumulates, block finality, residual exposure and committed neutralizations, the closure sequence, submission outcomes, and what has to survive a restart. Together they say where and what; none of them says which reading in the code is wrong, and the instruction lists neither the rules nor the consequences.

Six diagnostic suites ship as well, all candidate owned rather than graded, since nothing under `/app/tests` reaches the verifier: observation identity, direct progress, block reconciliation, neutralization lifecycle, restart recovery and cross-mandate isolation, twenty-four scenarios in all, each driving the engine through its public surface against an in-memory venue and reporting the observable outcome it saw in the words of the specification. On the starting repository nine of the twenty-four pass and the failures fall in every suite, which localises symptoms without naming a fix. Passing all six is necessary rather than sufficient: the graded suite combines the rules, and the three lifecycle cases have no counterpart in the diagnostics.
"""

solution_explanation = """
The reference solution is stored as ordinary Rust source files under `solution/fixed/`, laid out in the same relative structure as the crate itself:

```
solution/solve.sh
solution/reference_plan.md
solution/fixed/src/types/snapshot.rs
solution/fixed/src/engine/fill_classifier.rs
solution/fixed/src/engine/neutralization.rs
solution/fixed/src/engine/cycle.rs
solution/fixed/src/engine/mod.rs
```

`solution/solve.sh` is a thin launcher. It sets strict shell mode, confirms that a Rust crate exists at /app, copies each corrected file from `solution/fixed/` to its matching path under /app, runs `cargo fmt` when rustfmt is available in the image, and finishes with an offline `cargo build --offline`. It installs nothing and fetches nothing.

The launcher copies five files so that the reference tree is complete whatever state /app has been left in. Three of them differ from the starting repository: `src/engine/fill_classifier.rs`, `src/engine/cycle.rs` and `src/types/snapshot.rs`. The other two, `src/engine/neutralization.rs` and `src/engine/mod.rs`, are byte identical to the starter, because the residual-gap neutralization planner and the re-exports were never wrong.

1. `src/engine/fill_classifier.rs` keeps the shape the starter already has, one record per order the engine itself submitted, keyed by client reference, and corrects what each of its three inputs means. Fill events carry a cumulative quantity and an at least once feed redelivers them, so a direct fill is kept as a high-water mark rather than folded in as an increment. Block matches are incremental and are deduplicated by `block_ref`. The open order list is point in time truth for an order that is still live and carries no timestamp. Every timestamped observation is tested against the record's half-open window before it counts, against the venue's own match timestamp.

   An observation is resolved by the client reference first, because it is the only key the engine always knows and the one that recovers an order whose acknowledgement was lost. The venue identifier is a fallback, resolved at the observation's own instant: among the records that have worn that identifier, the one whose window contains the instant is the order it names, because the venue recycles identifiers once a window has closed. A block resolves each covered identifier the same way. A venue identifier is learned only from an observation that is genuinely about the order.

   Dividing a block is the exact rule from the spec: build the eligible set from the covered orders the engine tracks that are in window, not yet closed by an earlier block, and with outstanding quantity above zero; sort it ascending by attribution window start, then venue sequence, then order identifier lexicographically; take `min(block_qty, basis)` over a basis that is the sum of outstanding quantities; give each order its truncated proportional share; hand the truncation remainder out one base unit at a time in that same order; then close every covered order, because a block closes what it names whatever it gave it. A closed order acquires nothing more from any later observation. An order whose acknowledgement was lost has no venue sequence and sorts last.

2. `src/engine/cycle.rs` is the other half. A leg is complete when the quantity attributed to its own client reference, plus the quantity attributed to neutralization orders placed for the same mandate and venue, reaches the leg size, compared with exact integer arithmetic. The custody account inventory is not consulted for completion at all.

   Closure is guarded by a three state visibility rule. An order still listed is resting and is moved into closure over two cycles, so a fill in flight has a cycle in which to land before a corrective order is sent. An order the engine itself cancelled, or that the venue closed by naming it in a block, is withdrawn: nothing about it is in flight, and its residual is covered directly, with no cancellation sent for an order the venue has already closed. Anything else is unconfirmed and is never neutralized against, because its disappearance from the list may mean it filled.

   The residual is the leg size less what is attributed to the leg less what is still working in corrective orders the engine has committed to, where an acknowledged corrective contributes its outstanding quantity, one whose acknowledgement was lost contributes its full size, and one the venue has closed contributes nothing. Every corrective order is recorded before submission with a fresh client reference. On a lost acknowledgement the record is kept and tracked under its reference, and the next cycle resubmits under the same reference; the venue deduplicates, returns the original order, and the record resolves. On an outright refusal the record is dropped, so the next cycle recomputes the residual and submits a fresh attempt.

   Entry legs are tracked under their client reference from the moment they are committed, before the venue answers, so the attribution window opens at the commitment. An entry leg whose acknowledgement was lost is kept as a durable attempt; on a later cycle its identity is recovered from any observation carrying its reference, or the leg is resubmitted under that same reference and the venue's answer names the original order, and the leg then joins the tracked pair with its original window start. When a mandate settles, every closure and cancellation entry keyed by its venue identifiers is dropped, so a later order that comes to wear a recycled identifier inherits nothing.

3. `src/types/snapshot.rs` gains one field: the entry attempts whose acknowledgement was lost, each carrying the strategy, instrument, venue, price, size, expiry, client reference and the instant its window opened. Everything else the restart list requires was already durable: the feed cursor, the submission records with their original window starts and closed state, the absorbed block references, closure and cancellation state, committed neutralizations acknowledged or not, and the client reference sequence.

The public contract is unchanged: `Engine::new` keeps its seven arguments, `run_cycle`, `positions` and `pending_orders` keep their signatures, and every port keeps its methods.
"""

verification_explanation = """
Verification runs in a separate verifier image built from tests/Dockerfile. There is no pytest, pip, apt, or network access. The agent image never contains the verifier, its private observations, or the reference solution. Nothing the candidate leaves under /app/tests reaches grading: the verifier assembles a candidate-linked runner from its own locked manifest and scenario sources plus only regular Rust files under /app/src, while discarding candidate manifests, build scripts, cargo configuration, binaries, and symlinks.

Grading is out of process. The candidate-linked runner executes one scenario at a time as an unprivileged account and writes a bounded deterministic record of raw venue and public-API observations. Its assertions expand to no operations, so expected operands are absent from that executable. A second verifier-owned judge process, which never links or imports candidate code, compares those records with private reference observations and alone controls the report and reward. Candidate stdout, stderr, process status, cargo test status text, and success-looking messages have no grading authority. A mandatory verifier-owned expected-failure control must reject exactly one altered raw observation before reward can become 1.

The reward file is written 0 before any candidate code is built or run, the log directory is closed to everyone but the verifier before the candidate phase, and the reward is written 0 again, unconditionally, after the last candidate-linked process has exited and before the judge runs, so nothing a candidate manages to write there survives. The candidate-linked build has a budget of three hundred seconds, each case has a budget of sixty seconds, and the whole candidate phase must end within six hundred seconds of verifier start; the first case to exhaust its budget fails the run closed, no further candidate code is run, and the verifier finishes normally with reward 0 well inside its own envelope. A candidate that hangs, hangs the compiler, crashes, exits early without an artifact, writes a malformed artifact, prints success-looking text, does not compile, replaces a source file with a symlink, ships a manifest or build script or cargo configuration, plants a binary, or sets compiler-redirecting environment variables was run through the script and scored 0 in every case; a candidate that writes 1 into the reward file and a passing report from inside its own process scores 0, and one that reads the private expectations or the judge from inside its process finds them unreadable.

Grading is outcome based. Nothing greps the candidate's source. Nothing requires a particular struct, field, function name, lock, algorithm, or file layout. The engine is driven only through its frozen public surface and its six injected ports, so any correct internal design passes.

The graded suite holds thirty six behavioural scenarios driven by a declarative harness with a virtual clock, a seeded generator, and a fake venue that follows /app/spec/venue-semantics.md, including identifier recycling and a lost acknowledgement on a chosen venue. Orders are referred to by strategy and venue, never by identifier. The number of cases the judge must see is checked: fifty two records, thirty six from the scenarios and sixteen from a frozen-contract probe, each compared byte for byte with the private reference record, apart from one repeatability case that compares each pair of candidate runs with each other.

Covered behaviour: symmetric and asymmetric paired fills creating exactly one position with correct per leg sizes and no taker order; a genuine one sided fill producing exactly one neutralization at the right size and price; an opening custody account inventory and an inventory left over from a previous strategy failing to complete a leg; a partly filled opposite leg neutralized for the remainder only; a frozen inventory source across many cycles producing no duplicate position, no duplicate neutralization, and no dropped live orders; completion reached from the event feed alone; a partial remainder sized from the open order list alone when the event feed is withheld; a leg whose state is momentarily unknown never being neutralized against; a neutralization fill not re-counted as a fill of the original resting order; two strategies sharing one instrument identifier staying attributed separately; restart with unresolved orders, including two consecutive restarts, and a restart across which a fill that is recoverable from no live source must survive in the persisted ledger; a lost acknowledgement followed by a retry producing one economic neutralization; a refused first neutralization that must still be retried; independent progress across two strategies; and thirty two seeded event orderings asserting that acquired quantity never exceeds intended quantity per strategy and venue while genuine fills still complete.

Then the exactness cases. Both attribution window boundaries are graded for a block, and so is the second on either side of each, and a fill event stamped at the instant the window closes is graded as not attributed. A block of thirty eight over outstanding quantities of ten, ten and thirty pins the truncated division and the placement of its two leftover base units, with the venue listing the covered orders in an order that must not matter. All three levels of the tie-break get their own case. A redelivered block is graded for idempotency. One case pins the basis of the division on its own: three covered orders each partly filled first, and a block that divides exactly over what is left of them. Two further cases chain the rules: a second block divided over residuals that exist only as the result of the first, and the compound case, where a block lands exactly on a window start over three equally eligible orders whose shares truncate, with the remainder placed by the tie-break, and a second block whose total is either exactly the residual basis or one base unit short.

Then the three lifecycle cases. A mandate settles, the venue recycles the identifier of its cancelled leg onto a later mandate's leg after the window has passed, the whole feed is replayed and the process restarts: the later mandate completes and nothing keyed by the old identifier touches it. The South entry leg's acknowledgement is lost, the order fills at the venue while the feed is withheld, the process restarts, and the leg is recovered under its original client reference and its original window with the venue answering the retry with the existing order, so that exactly one economic order per leg exists, the fill is attributed when the feed catches up, and the other leg is closed and corrected. Three corrective orders are partly filled directly, a block divides over what is left of them and allocates two of them nothing, every covered order is closed, the gaps are re-covered, and a replay of the block after a restart changes nothing.

A second suite holds sixteen frozen-contract probes over behaviour the task does not ask to change: the cancel lead, the exit window and its inclusive bounds, expiry, position cost arithmetic, exact integer quantity comparison at the one base unit boundary, the integer proportional share formula and its truncation toward zero, the attribution window constant and the half-open bounds a pending order reports, timestamp arithmetic, cursor defaults and the engine configuration defaults.

An untouched repository fails twenty one of the thirty six scenarios and scores 0. The fifteen it passes are liveness and anti regression checks, which is deliberate, so a candidate that scores by disabling neutralization or by clearing pending state on uncertainty fails immediately. All sixteen frozen probes pass on the untouched repository, because the frozen contract is not what is broken. The six candidate-owned diagnostic suites show the same shape from the candidate's side: nine of their twenty-four scenarios pass on the untouched repository, and all twenty-four pass under the reference.

Thirty two solver variants were built from the reference solution, each by one targeted change, and every one was scored end to end through the real verifier script rather than by inspection. Twenty eight scored 0: folding cumulative fill events in as increments; adding the open order list's figure on top of the feed's; closing the window at its upper end; resolving observations by venue identifier only; ignoring the window on fill events; equal split instead of proportional shares; a basis of submitted size rather than outstanding quantity; dropping the truncation remainder; handing it to the largest order; ordering the eligible set by identifier alone; leaving a zero-share covered order working; neutralizing the full leg; ignoring attributed quantity; ignoring quantity working in committed corrective orders; treating a lost acknowledgement as a refusal; treating a refusal as a committed order; not persisting direct progress; not persisting committed neutralizations; deciding completion from custody inventory; sharing attribution between mandates on one instrument; dropping an entry leg whose acknowledgement was lost; leaving closure state behind when a mandate settles; resolving the venue identifier before the client reference with the oldest holder; resetting the client reference counter on restart; counting an unacknowledged corrective as working nothing; retrying a lost acknowledgement under a fresh reference; neutralizing an unconfirmed leg; and counting a finalized corrective as still working. Four variants score 1 and are reported rather than counted, because on this contract they are not wrong answers: not deduplicating a replayed block by its reference, and not persisting the absorbed block references, are both made harmless by block finality, since every order a block names is closed at its first delivery and a replay finds nothing eligible; keeping an order an earlier block closed in a later block's eligible set is unreachable, because the fake venue, like the documented one, never names a closed order again; and treating a resting leg the venue closed in a block as unconfirmed is left to a candidate-owned diagnostic rather than graded. The eight final implementations from the earlier evaluation of this task were also replayed through the final verifier: two pass, and six fail on the recycled identifier case, the lost entry acknowledgement case, or both.

Hostile artefacts were run against the verifier one at a time on top of the untouched project, and the reward stayed 0 in every case: a reward file and report pre-written to a pass before the verifier starts; a candidate that writes 1 into the reward file, a passing report and a passing verdict from inside its own process; a candidate that tries to read the private expectations, the judge, the case manifest and the graded scenarios from inside its process, all of which are unreadable to it; a candidate that prints passing test output; one that appends a fabricated record to its own observation file; one that replaces the reward file with a symlink; a candidate crate manifest with a build script, a cargo configuration with a compiler wrapper and a target runner, and a build script under src; a planted graded binary under the candidate's target directory; compiler-redirecting environment variables set on the verifier container; a source file replaced by a symlink, refused before any build; a candidate that does not compile; a candidate that panics in every cycle; one that exits the process without writing an artifact; one that loops forever, which fails closed at the first case budget with a normal verifier exit; and one whose compilation never finishes, which fails closed at the build budget.

The verifier writes 0 to /logs/verifier/reward.txt before building or running candidate code, writes a deterministic CTRF report to /logs/verifier/report.json, and overwrites the reward with 1 only when all fifty two observations match and the mandatory expected-failure control is detected.
"""

