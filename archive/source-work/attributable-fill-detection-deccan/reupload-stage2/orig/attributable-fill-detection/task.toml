difficulty_explanation = """
The persona is an execution services engineer on a market making desk: the person who owns the reconciler sitting between the firm's own order management system and the venue's drop copy feed, and who is paged when the firm's book and the exchange's book disagree by one lot. That work is almost never greenfield. The ledger already exists, it was written by someone who has since left, it compiles, it passes the obvious cases, and it is quietly wrong about the boundary conditions of an at least once feed. The engineer reads the exchange's own specification, works out which of several defensible readings the venue actually guarantees, and corrects them without disturbing the parts of the reconciler other desks depend on. This task is that job.

The starting repository is therefore not greenfield. The engine's control flow is right: it sizes legs, submits the pair, cancels near expiry, and creates positions with correct arithmetic. The attribution architecture is present too. `src/engine/fill_classifier.rs` keeps one record per order the engine submitted, keyed by client reference, carrying the order id, the size, the instant the attribution window opened, the venue sequence number, the quantity attributed directly and from block matches, and whether the venue has closed the order; it owns the feed cursor and the set of block references already absorbed. `src/engine/cycle.rs` folds the open order list and the fill feed into that ledger on every cycle, keys neutralizations by client reference, derives leg visibility from the open order list, and writes the whole structure into the snapshot and restores it on restart. All of it compiles before the candidate edits anything, and none of it is what the task is about.

What is wrong is how the observations are read and how the derived quantities are computed. Nothing in the source says which readings are wrong. /app/spec/venue-semantics.md states what the venue guarantees and /app/spec/reconciliation-contract.md states what the engine must do with those observations; together they are the authority, and where the code and those documents disagree, the code is what changes. The ten readings below are the ones those rules pin down, not a list of defects: the starting repository gets several of them wrong, and the rest are constraints a careless correction breaks. Which is which is written nowhere the candidate can read. They interact rather than stack:

1. Fill events carry a cumulative quantity and an at least once feed redelivers them. Folding one in as an increment inflates a leg on redelivery, and a redelivered batch is indistinguishable from progress unless the record is kept as a high-water mark.

2. Attribution windows are half-open, tested against the venue's own match timestamp rather than the cycle that read the event. An observation exactly at the start is inside; one exactly at start plus ATTRIBUTION_WINDOW is outside. Both boundaries are graded, and so is the second on either side of each. The open order list carries no timestamp and is exempt.

3. Quantity is a whole number of base units with no comparison tolerance, and where a quantity is divided the division truncates toward zero. There is no epsilon to hide a mistake in: one base unit invented by rounding changes which legs complete and the size of the corrective orders that follow.

4. When the venue nets several of the engine's own orders into one match it reports only the total. Deriving each share means ordering the eligible set by attribution window start, then venue sequence, then order identifier lexicographically, taking truncated proportional shares over the sum of outstanding quantities, and handing the remainder out one base unit at a time in that same order. Container iteration order, the order the venue happened to list the covered orders in, the largest truncated fraction and the largest order are all available and all wrong. Order identifiers are opaque venue labels whose lexicographic order deliberately contradicts arrival order, so sorting by identifier alone yields a plausible answer that is wrong.

5. The basis is outstanding quantity, not submitted size. A block covering orders that were already partly filled divides over what is left of them, so an implementation that divides over the original sizes agrees with the rule until an earlier fill has landed and then disagrees.

6. `block_ref` is the venue's idempotency key for a block, and a replayed block that is not deduplicated by it is counted twice.

7. An order missing from the open order list may have filled rather than been withdrawn, so treating absence as certain withdrawal neutralizes against quantity the desk already owns.

8. A lost acknowledgement means the venue accepted an order it never named back. A retry under a freshly minted client reference places the same economic exposure twice.

9. A corrective order already working at the venue is quantity the desk has committed even though nothing has been attributed to it yet. Sizing the next correction from the attributed quantity alone, without subtracting what is still outstanding, sends the same exposure twice across consecutive cycles; subtracting a record the venue has since closed under-corrects and leaves the leg short.

10. Window starts, absorbed block references and the client reference counter all have to be durable. A restart that reopens a window admits an observation from outside the original one; a forgotten block reference counts a block twice; a reset counter regenerates a reference the venue already knows, and the venue deduplicates it onto an unrelated order.

These rules compose, and that is where the real difficulty is. A block's division depends on outstanding quantities that are themselves the residue of an earlier division, so one base unit misplaced in the first block changes the basis of the second, which changes which legs complete and which corrective orders are sent. One graded case combines a block landing exactly on a window start, three equally eligible orders whose shares truncate, a remainder placed by the tie-break, and a second block divided over residuals that appear nowhere in the task text and can only be obtained by replaying the observations correctly. A second case is identical except that the final block is one base unit short, and it must leave a leg open. Every rule in that pair decides the same observable outcome, so a candidate who has nine of the ten readings right sees the same failure as one who has four.

The work is long horizon because the failures only reproduce under specific interleavings: a redelivered feed batch, a restart between two cycles, a block that arrives before the order it covers has been polled. The candidate reads the frozen contract and the venue rules, forms a model of order identity against a cumulative at least once feed, corrects the readings one at a time, and interprets partial failures without seeing the graded suite. Mid level Rust engineer familiar with exchange reconciliation: roughly 3 hours. An engineer who has never reconciled an order book against a replaying feed can spend considerably longer.

Four documents ship in the agent image to remove accidental discovery cost rather than difficulty. /app/spec/source-map.md maps each concern to the file that owns it, names the entry point, and lists eleven places where a reading of the venue is chosen, which is more than the number the code gets wrong, so it is a map and not a checklist. /app/spec/frozen-contract.md pins the public surface, says which single type is meant to grow, and states that modules and subdirectories may be added under src/engine so nobody assumes a single-file rewrite is required. /app/spec/venue-semantics.md states the window, division, remainder, finality and idempotency rules in full, including that a block closes every order it names and not only the ones its division allocated something to. /app/spec/reconciliation-contract.md states the engine's side of the same contract: that direct fill progress is one cumulative figure reported by two observations and therefore a high-water mark rather than a sum, that block shares are additive and deduplicated by block reference, how residual exposure is computed from the required quantity less what is attributed and less what is still working in committed neutralizations, how an unacknowledged neutralization and a finalized one each count toward that, that an unconfirmed leg is never neutralized against, that a resting leg passes through closure before a corrective order is issued for what remains, and what has to survive a restart. Together they say where and what; none of them says which reading in the code is wrong.

Two offline aids ship as well, and both are candidate owned rather than graded, since nothing under /app/tests reaches the verifier. /app/tests/diagnostics.rs checks one documented rule at a time on synthetic values invented for the check, and reports the rule it broke rather than a case number, so a failing line points at a sentence of the spec. /app/src/bin/reproduce.rs is coarser and drives five whole failure modes end to end against in-memory fakes, printing one PASS or FAIL line per behaviour. On the starting repository six of the seventeen diagnostics pass, which localises the defects without naming their fix. Passing both is necessary rather than sufficient: the graded suite combines the rules, and no single-rule check can tell a candidate that a combination is right.
"""

solution_explanation = """
The reference solution is stored as ordinary Rust source files under `solution/fixed/`, laid out in the same relative structure as the crate itself:

```
solution/solve.sh
solution/reference_plan.md
solution/fixed/src/types/snapshot.rs
solution/fixed/src/engine/fill_classifier.rs
solution/fixed/src/engine/neutralization.rs
solution/fixed/src/engine/cycle.rs
solution/fixed/src/engine/mod.rs
```

`solution/solve.sh` is a thin launcher. It sets strict shell mode, confirms that a Rust crate exists at /app, copies each corrected file from `solution/fixed/` to its matching path under /app, runs `cargo fmt` when rustfmt is available in the image, and finishes with an offline `cargo build --offline --tests`. It installs nothing and fetches nothing.

The launcher copies five files so that the reference tree is complete whatever state /app has been left in, but only two of them differ from the starting repository. `src/engine/fill_classifier.rs` and `src/engine/cycle.rs` together account for the whole patch: 81 lines added and 107 deleted. The other three — `src/types/snapshot.rs`, `src/engine/neutralization.rs` and `src/engine/mod.rs` — are byte identical to the starter, because the starter already ships the durable snapshot fields, the residual-gap neutralization planner and the re-exports. The work is entirely in how the venue's observations are read and how the derived quantities are computed. Nothing outside fill processing moves, and the public contract is untouched.

1. `src/engine/fill_classifier.rs` keeps the shape the starter already has — one record per order the engine itself submitted, keyed by client reference and carrying the order id, the size, the instant the attribution window opened, the venue sequence number, the quantity attributed directly, the quantity attributed from block matches, and whether the venue has closed the order — and corrects what each of its three inputs means. Fill events carry a cumulative quantity and an at least once feed redelivers them, so a direct fill is kept as a high-water mark rather than folded in as an increment. Block matches are incremental and are deduplicated by `block_ref`, the venue's own idempotency key. The open order list is point in time truth for an order that is still live and carries no timestamp. Mapping client reference to order id is what makes a lost acknowledgement recoverable. Because direct fills are kept as a maximum and blocks are deduplicated, at least once redelivery and replay are absorbed without double counting. The module owns the feed cursor.

   Every timestamped observation is tested against the record's half-open window before it counts, and against the venue's own match timestamp rather than the cycle that read it, so an event at the window start is attributed and one at the window end is not. The open order list is exempt, which the spec states explicitly.

   Dividing a block is the exact rule from the spec: build the eligible set from the covered orders the engine tracks that are in window with outstanding quantity above zero, sort it ascending by attribution window start, then venue sequence, then order id lexicographically, take `min(block_qty, basis)` over a basis that is the sum of outstanding quantities rather than of submitted sizes, give each order its truncated proportional share, then hand the truncation remainder out one base unit at a time in that same order. Every covered order is then finalized, because a block closes what it names whatever it gave it, and a finalized record reports zero outstanding so the next cycle sizes its follow-up from the residual gap. An order whose acknowledgement was lost has no venue sequence, and sorts last rather than ahead of a confirmed one.

2. `src/engine/cycle.rs` is the other half. The cycle already reads the open order list and the fill feed first and folds both into the ledger; what changes is the reading. A leg is complete when the quantity attributed to its own client reference, plus the quantity attributed to neutralization orders placed for the same mandate and venue, reaches the leg size, compared with exact integer arithmetic and no tolerance. The custody account inventory is not consulted for completion at all; the inventory port survives only as a cash affordability check when entering a mandate.

   Hedging is guarded by a three state visibility rule derived from the open order list. An order still listed is resting. An order the engine itself cancelled is withdrawn. Anything else is unconfirmed, and an unconfirmed leg is never neutralized, because its disappearance from the list may mean it filled rather than that it went away. Closure is a two step move: the first cycle marks the leg, the next cycle cancels it and neutralizes the residual gap, which gives a fill in flight a chance to land before another economic order is sent.

   Every neutralization is recorded before submission with a fresh client reference and no order id. On a lost acknowledgement the record is kept, and the next cycle resubmits under the same client reference; the venue deduplicates, returns the original order, and the record is resolved. On an outright refusal the record is dropped, so the next cycle recomputes the gap and submits a fresh attempt, which is what keeps a strategy from being permanently blocked. The gap calculation subtracts both attributed quantity and outstanding neutralization quantity, so an unresolved neutralization cannot be placed twice.

The three files the launcher copies unchanged are worth naming, because they are the architecture the candidate is given rather than work the candidate has to invent.

3. `src/types/snapshot.rs` already carries the fields that must survive a restart: the feed cursor, the submission records, the set of block references already absorbed, the set of orders marked for closure, the set of orders already withdrawn, the outstanding neutralization records, and the client reference sequence counter. The window start inside each submission record is durable, because a restart that reopened a window would let an observation from outside the original window count. The absorbed block references are durable for the mirror image reason: a forgotten block reference is a block counted twice. The sequence counter matters because a reset counter regenerates a client reference the venue already knows, and the venue would deduplicate it onto an unrelated order. The candidate may extend this type but does not have to design it.

4. `src/engine/neutralization.rs` already plans a neutralization for the residual gap it is handed rather than for the full leg size, and declines to plan at all when that gap is below one base unit. Quantities are integers, so a gap is either a whole number of base units worth covering or it is nothing.

5. `src/engine/mod.rs` is the module wiring and its re-exports.

The public contract is unchanged: `Engine::new` keeps its seven arguments, `run_cycle`, `positions` and `pending_orders` keep their signatures, and every port keeps its methods.
"""

verification_explanation = """
Verification runs in a separate verifier image built from tests/Dockerfile. There is no pytest, pip, apt, or network access. The agent image never contains the verifier, its private observations, or the reference solution. Nothing the candidate leaves under /app/tests reaches grading: the verifier assembles a candidate-linked runner from its own locked manifest and scenario sources plus only regular Rust files under /app/src, while discarding candidate manifests, build scripts, cargo configuration, binaries, and symlinks.

Grading is out of process. The candidate-linked runner executes one existing scenario at a time as an unprivileged account and writes a bounded deterministic record of raw venue and public-API observations. Its assertions expand to no operations, so expected operands are absent from that executable. A second verifier-owned judge process, which never links or imports candidate code, compares those records with private reference observations and alone controls the report and reward. Candidate stdout, stderr, process status, cargo test status text, and success-looking messages have no grading authority. A mandatory verifier-owned expected-failure control must reject exactly one altered raw observation before reward can become 1.

Grading is outcome based. Nothing greps the candidate's source. Nothing requires a particular struct, field, function name, lock, algorithm, or file layout. The engine is driven only through its frozen public surface and its six injected ports, so any correct internal design passes.

The graded suite holds thirty two behavioural checks driven by a declarative scenario harness with a virtual clock and a seeded generator. Orders are referred to by strategy and venue, never by identifier. The harness in the candidate tree is overwritten with pristine copies before the suite runs, so edits to the fakes are discarded, and the reward decision is made by the verifier only. The number of checks it must see is not hard coded: the verifier counts the `#[test]` attributes in its own graded and frozen sources, requires that many passes and no failures, and compares the set of passing test names against the set parsed from those sources, so a suite that is silently shortened or renamed cannot be reported as a full pass.

Covered behaviour: symmetric and asymmetric paired fills creating exactly one position with correct per leg sizes and no taker order; an idle strategy creating nothing; a genuine one sided fill producing exactly one neutralization at the right size and price; an opening custody account inventory and an inventory left over from a previous strategy failing to complete a leg; a partly filled opposite leg neutralized for the remainder only; a frozen inventory source across many cycles producing no duplicate position, no duplicate neutralization, and no dropped live orders; completion reached from the event feed alone when the inventory source is frozen entirely; a partial remainder sized from the open order list alone when the event feed is withheld, which is the converse case; a leg whose state is momentarily unknown, filled but not yet reported and no longer resting, never being neutralized against; a neutralization fill not re-counted as a fill of the original resting order; two strategies sharing one instrument identifier staying attributed separately; restart with unresolved orders, including two consecutive restarts, and a restart across which a fill that is recoverable from no live source must survive in the persisted ledger; a lost acknowledgement followed by a retry producing one economic neutralization; a refused first neutralization that must still be retried so the strategy makes progress; independent progress across two strategies; and thirty two seeded event orderings asserting that acquired quantity never exceeds intended quantity per strategy and venue while genuine fills still complete.

Then the exactness checks, which are the harder half. Both attribution window boundaries are graded, and so is the second on either side of each: a match timestamped exactly at the window start must be attributed, one exactly at the window end must not, and moving either comparison by one second changes the observable outcome. A block of thirty eight over outstanding quantities of ten, ten and thirty pins the truncated division and the placement of its two leftover base units, with the venue listing the covered orders in an order that must not matter. All three levels of the tie-break get their own case: orders separated by window start, orders sharing a window start and separated by venue sequence, and orders sharing both and separated only by their identifiers. Because the harness gives the venue an opaque label alphabet, lexicographic identifier order contradicts arrival order in every one of those cases, so a candidate who sorts by identifier alone produces a plausible answer that is wrong. A redelivered block is graded for idempotency. One case pins the basis of the division on its own: three covered orders of ten, ten and thirty are each partly filled first, leaving outstanding quantities of six, six and twenty four, and a block of eighteen then divides exactly over that basis of thirty six. Dividing instead over the submitted sizes gives a basis of fifty, two different truncated shares and two leftover units to place, so the follow-up orders the engine sends differ; the numbers are chosen so the division is exact and no tie-break can absorb the mistake. Two further cases chain the rules: a second block divided over residuals that exist only as the result of the first, and the compound case, where a block lands exactly on a window start, over three equally eligible orders whose shares truncate, with the remainder placed by the tie-break, and a second block whose total is either exactly the residual basis or one base unit short. Those two runs differ by a single base unit and produce different sets of completed mandates. The quantity attributed to any one order in these cases is written nowhere in the task text; it exists only as the result of applying the documented rule to the supplied observations.

A second suite holds sixteen regression checks over behaviour the task does not ask to change: the cancel lead, the exit window and its inclusive bounds, expiry, position cost arithmetic, exact integer quantity comparison at the one base unit boundary, the integer proportional share formula and its truncation toward zero, the attribution window constant and the half-open bounds a pending order reports, timestamp arithmetic, cursor defaults and the engine configuration defaults.

An untouched repository fails seventeen of the thirty two graded checks and scores 0. The fifteen it passes are the liveness and anti regression checks, which is deliberate, so a candidate that scores by disabling neutralization or by clearing pending state on uncertainty fails immediately. All sixteen regression checks pass on the untouched repository, because the frozen contract is not what is broken. The two offline aids show the same shape from the candidate's side: six of the seventeen public diagnostics pass on the untouched repository, and all seventeen pass under the reference.

Twelve near miss variants were then built from the reference solution, each by one targeted change to a single reading, and every one of them was scored end to end through the real verifier script rather than by inspection. All twelve scored 0, and the reference scored 1 at forty eight of forty eight with a matching name set. In failure count order: deriving completion from the custody account inventory alone with no attribution ledger fails twenty; building attribution from the open order list alone without the feed fails twenty eight; building it from the event feed alone without the list fails one; computing the proportional shares in floating point and rounding to nearest instead of truncating toward zero fails six; folding cumulative fill events in as increments instead of keeping a high-water mark fails five; handing the truncation remainder to the largest outstanding order rather than to the earliest in the documented ordering fails four; retrying a lost acknowledgement under a freshly minted client reference so the venue cannot deduplicate it fails two; failing to persist the ledger and cursor across a restart fails two; treating the attribution window as closed at its upper end, a one character change from `<` to `<=`, fails one; treating an order's absence from the open order list as certain withdrawal fails one; not deduplicating a replayed block by its `block_ref` fails one; and dividing a block over the covered orders' submitted sizes rather than their outstanding quantities fails one.

The four smallest of those are the point of the exactness half. Each is correct everywhere else and is indistinguishable from the documented rule on every ordinary case in the suite, so each is caught by one check built for it: the window end variant by the boundary case, the block basis variant by the partly filled block, the replay variant by the redelivered block, and the visibility variant by the momentarily unknown leg. The remainder variant is the sharpest of the larger group, failing only the cases where a truncation remainder actually exists. Nine earlier variants built while the attribution model was being designed each removed one neutralization mechanism instead: neutralizing a leg whose state is unknown, suppressing duplicates with a permanent per strategy flag that then blocks a legitimate second attempt, sizing the neutralization at the full leg rather than the residual gap, ignoring neutralizations already in flight when computing that gap, and failing to persist the client reference counter among them. Every check those were rejected by is still in this suite.

Exploit resistance was checked separately against the unmodified broken crate plus one hostile artefact at a time, and the reward stayed 0 in every case: a rewritten crate manifest, a planted test suite at /app/tests, a cargo runner shim in /app/.cargo/config.toml, a build script that writes the reward file, a cargo binary planted earlier on PATH, a compiler redirecting environment (RUSTC_WRAPPER, a target runner, RUSTFLAGS and CARGO_HOME all pointed at candidate controlled paths), a reward file pre written to 1 before the verifier starts, and a deliberately uncompilable reproducer under src/bin.

The verifier writes 0 to /logs/verifier/reward.txt before building or running candidate code, writes a deterministic CTRF report to /logs/verifier/report.json, and overwrites the reward with 1 only when all forty eight observations match and the mandatory expected-failure control is detected.
"""

