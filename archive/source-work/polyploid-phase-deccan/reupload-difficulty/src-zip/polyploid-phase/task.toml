difficulty_explanation = """
The real-world persona is a computational genetics engineer supporting a
polyploid breeding programme: the person who turns low-depth progeny likelihoods
into a reproducible parental phase that geneticists can use downstream. This is
a combinatorial optimisation problem wearing genetics clothing, and the genetics
is what makes the optimisation awkward rather than what makes it hard.

Two autotetraploid parents are crossed. Each parent carries four homologous
copies of one linkage group, and every marker is biallelic, so a parent's state
at a marker is which of its four homologs carry the alternate allele. The
progeny were sequenced at low depth, so the input gives, for every progeny and
every marker, five log likelihoods over the possible alternate allele dosages
zero to four rather than a called genotype. The task is to recover both parents'
four haplotypes and every progeny's inheritance path at the global maximum of the
supplied scorer.

The environment is a Rust crate with one solver entry file and an optional
`src/solver/` helper-module directory. The scorer, the reader,
the writer, the digest and the domain types are frozen and the verifier keeps its
own copies of them, so the objective cannot be argued with — only maximised.
`src/solver.rs` holds a placeholder that fixes each parent's alleles marker by
marker and then runs an exact Viterbi pass per progeny. It compiles, it produces
a structurally valid document, and it is wrong for a reason the task is built
around.

Six traps sit in the way, and they interact.

1. An inheritance state is an unordered pair `(a, b)` with `0 <= a <= b < 4`.
   Ten states, not sixteen. A solver that treats `(1, 2)` and `(2, 1)` as two
   states double counts the state space, and one that writes a pair out of order
   produces output that is rejected without being scored.

2. Double reduction — a progeny receiving two copies of the same parental
   homolog, so `a == b` — is legal per parent and per marker, and the input says
   where. Allowing it everywhere is wrong: the optimum then contains states the
   result format rejects. Forbidding it everywhere is also wrong: several
   fixtures have double reduction in their optimum, and a solver that never emits
   one cannot reach it. Both failures are graded separately.

3. Homolog labels are arbitrary. Twenty-four relabellings of each parent describe
   the same biology at the same score, and exactly one is accepted. Sorting the
   rows is not enough to determine it, because when two homolog rows are
   identical — which the fixtures arrange — sorting leaves several permutations
   admissible and they differ in the paths. The specification resolves this with
   a path signature and then an image tuple, and canonicalisation must remap
   every inheritance state along with the rows and be idempotent.

4. The global optimum conflicts with the marker-at-a-time optimum. Choosing each
   marker's parental allele columns to maximise that marker's own contribution is
   the obvious decomposition and it is wrong, because the recombination terms
   couple adjacent markers. The verifier does not assume this: it runs a
   marker-at-a-time solver — one that recovers each progeny's path exactly, so it
   is not a strawman — and requires its score to fall short of the optimum before
   grading the candidate.

5. Distinct reconstructions can tie at the optimum. The specification names which
   one is required, by a row-major order over parent A's haplotype matrix, then
   parent B's, then the full path signature. A branch-and-bound search that
   prunes anything not strictly better than the incumbent silently lets the order
   of discovery pick the answer, and that is the single easiest way to produce a
   solver that is right on most inputs and unreproducible on the rest.

6. Recombination contributes across intervals. A solver that scores markers in
   isolation, or that holds each progeny's state constant along the chromosome,
   misses it.

The load-bearing derived value is `canonical_digest`: a 64 bit FNV-1a hash over a
fixed serialisation of the canonical reconstruction. Its algorithm and byte
sequence are fully specified and a helper that computes it ships with the crate,
so the digest is not a puzzle in itself. What it cannot be is guessed, recalled
or pattern matched: it is a function of the exact optimum in the exact canonical
form for the exact cross supplied, and it appears in no document the agent can
read. An answer that is optimal but not canonical, or canonical but not optimal,
produces a digest that does not match.

The search space is the reason this takes hours rather than minutes. Dosage
constrains a parent to `C(4, dosage)` allele columns per marker — at most six —
so enumerating column assignments is up to `6^M` per parent, about `2.2e9` at the
twelve marker floor and around `4.7e18` for the two parents together. Brute force
is unavailable at every size in the declared range. What makes an exact answer
reachable is that only one term of the objective depends on the parental alleles,
that the progeny factorise into small Viterbi problems given those alleles, that
the per-parent transition structure factorises a hundred-state product into two
ten-state passes, that two independent admissible bounds can be computed and
minimised, and that homolog symmetry can be quotiented during the search rather
than after it. Finding that structure is the work.

An agent that reaches for a heuristic gets a plausible answer and zero. There is
no partial credit: the required score is the global maximum to within `1e-8`, the
required form is canonical, and the required digest is exact.

A strong engineer comfortable with dynamic programming over hidden state and with
branch and bound: roughly four hours. One who tries to hard call dosages first,
or who optimises markers independently, can spend considerably longer, because
both approaches produce a confident wrong answer that passes their own sanity
checks.
"""

solution_explanation = """
The reference solution is ordinary Rust source, laid out under `solution/fixed/`
in the same relative structure as the crate:

```
solution/solve.sh
solution/reference_plan.md
solution/fixed/src/solver.rs
solution/fixed/src/solver/columns.rs
solution/fixed/src/solver/progeny_dp.rs
solution/fixed/src/solver/bounds.rs
solution/fixed/src/solver/search.rs
solution/fixed/src/solver/path.rs
solution/fixed/src/solver/canonical.rs
```

`solution/solve.sh` is a thin launcher. It sets strict shell mode, resolves its
own directory so it works from any working directory, installs `solver.rs` and
the `solver/` module directory over the placeholder, builds offline in release
and runs the `phase` binary. It installs nothing and fetches nothing. No frozen
module is touched.

The design rests on five decisions.

The search branches on the shared quantity. Progeny are conditionally independent
given the parental haplotypes but they all share those haplotypes, so the columns
cannot be chosen one progeny at a time. The search descends marker by marker over
the admissible column pairs — at most six per parent, so at most thirty-six pairs
— carrying every progeny's dynamic programme forward together. At each node the
score of the decided prefix is exact.

Advancing a progeny is factorised. A joint state is a pair of per-parent states
and the transition term factorises across parents, so one marker's advance is two
ten-by-ten passes over an intermediate rather than a hundred-by-hundred product.
It is done once per node, before the node's children are generated, because it
does not depend on which columns those children pick.

Two admissible bounds are computed and minimised. `RemainingBound` frees the
columns: for each progeny and each joint state, the best score reachable to the
end of the chromosome if the parental alleles were chosen freely at every
remaining marker, with the path still required to be continuous; a backward pass
computes it once per cross. `MarkerBound` keeps the columns shared and frees the
path instead, charging each remaining interval the largest transition
contribution any path can collect there, which is valid because `r <= 0.5` on
every interval forces `ln(r) <= ln(1 - r)`. Neither dominates the other and the
minimum of two upper bounds is an upper bound.

Homolog symmetry is quotiented during the search. A `RowOrder` bitmask records
which of the twenty-four row orderings are still consistent with the columns
chosen so far, and a column that would make the assignment non-minimal within its
relabelling class prunes the branch. Applying this after the search would be a
cosmetic step; applying it during the search is what stops the tree carrying
twenty-four copies of every subtree.

Ties are preserved, not pruned. A node is discarded only when its optimistic
total falls strictly below `incumbent - 1e-9`, so a branch that can still tie
survives to be compared. When a complete assignment ties, the incumbent is
replaced only if the new assignment is row-major smaller, which is the order the
result format defines; distinct column assignments always give distinct haplotype
matrices, so this is a total order. Each progeny's path is then recovered
forward, greedily and lexicographically among states attaining the optimum, and
the result is canonicalised with the rows and every inheritance state remapped
together.

The exact search was cross-checked against exhaustive enumeration on every cross
small enough to enumerate; the two agreed on the optimum in every case that
completed. That is the evidence the bounds are admissible.

The public contract is unchanged: `solve` keeps its signature, the frozen modules
are untouched, and the `phase` binary still reads `/app/cross.json` and writes
`/app/result.json`.
"""

verification_explanation = """
Verification runs in a separate verifier image built from `tests/Dockerfile`.
The verifier owns its build configuration, its fixtures and its tests; none of
the three is taken from the candidate. The agent image contains no hidden
fixture, no certified answer and no reference solution, and its Dockerfile
copies path by path rather than with a blanket `COPY .`, so neither can arrive
by accident. The agent image does carry the two public test suites under
`/app/tests`, which the instruction documents and which the graded run never
consults.

The trust boundary is a build boundary, and the runner enforces it before
anything is graded. The candidate's `solver.rs` and any `.rs` file beneath
`src/solver/` are the only inputs consumed; a symlink anywhere under the
candidate source tree, or a non-Rust file under `src/solver/`, fails the run.
Those files are compiled into one binary, `probe`, in a sandbox built as an
unprivileged account that contains public frozen model code, cross inputs and
nothing else; the runner refuses to continue if a certified answer or any judge
source is found there. The second binary, `judge`, is built root-only from a
manifest with no probe target, in a tree the runner checks contains no
candidate-shaped solver source. The probe writes one reconstruction artifact
per job and decides nothing; its stdout, stderr and exit status are logged and
grade nothing. Certified answers are loaded only after the last probe has
exited. The judge recomputes legality and score with its own pristine scorer,
compares the full canonical structure and the recomputed digest against the
certified optimum, and writes the reward.

Grading runs fifteen probe jobs over nine hidden crosses: the nine as supplied,
three of them a second time because group K asks whether repeated runs agree,
and three with every genotype likelihood shifted by a constant, which moves
every total by the same amount and leaves the maximiser, the canonical form and
the tie order unchanged — the check a memorised or constant answer cannot
survive. Thirteen judge checks, groups A to M, each name one behaviour the
instruction or the three specification documents state publicly: the required
output document holds the optimum and its own digest; haplotypes respect
`parent_dosage`; inheritance states are ordered pairs naming existing homologs;
double reduction never appears where it is forbidden and is used where it is
optimal; answers are in canonical form, checked by enumerating all twenty-four
relabellings of each parent and applying the specification's selection rules
independently of how the candidate produced its answer; canonicalisation remaps
paths with the rows and is idempotent; every fixture reaches the global optimum
in full structure; a marker-at-a-time reconstruction falls short; recombination
between markers is accounted for; ties resolve to the documented
representative; the compound case is solved; and answers follow the supplied
cross. Alongside the thirteen there is one intentional negative control which
must fail; the runner requires it to fail, excludes it from the graded total,
and scores zero regardless of everything else if it ever reports a pass. The
verifier writes 0 to `/logs/verifier/reward.txt` before doing anything and
overwrites it with 1 only when all thirteen checks pass and the control is
intact. Both counts — probe jobs and graded checks — are read from the
verifier's own source, never from a candidate-linked binary.

The nine crosses sit at twelve to fourteen markers and eight to twelve progeny.
Seven were built by generation and rejection: candidate crosses were simulated
inside the accepted size ranges, handed to the exact branch-and-bound oracle in
a child process, and kept only when the oracle finished proving the global
optimum inside a fixed budget; a killed process produces no answer, so no
uncertified instance can become a fixture. The remaining two, `coupled_ties`
and `path_order`, pin `parent_dosage` to 0 or 4 at all but a few markers so
that every admissible parental assignment can be enumerated; their optima were
certified by the same oracle and then cross-checked against that exhaustive
enumeration, and their score, canonical form and digest were recomputed by an
independent implementation of the specification. They exist because the
original seven, on inspection, contained no path tie whose resolution differed
between the required forward order and a backward traceback, and none where
the required order differed from settling both parents marker by marker; the
two added crosses contain both, and also carry canonically distinct tied
assignments, so the ordering rules the result format states are graded rather
than merely stated. No fixture is enumerable inside the probe budget by a
solver that does not prune: the smallest joint column space among the nine is
around four hundred thousand assignments, each requiring a full pass over
every progeny.

The untouched project passes 3 of 13 and scores 0. The reference solution
passes 13 of 13 with the control failing as required, scores 1, and solves each
fixture in well under a second.

Twenty-seven solver variants were built from the reference solution and
measured against this verifier, each taking one plausible shortcut or one
plausible mistake, alongside one control that relabels the search's output and
then restores canonical row order before recovering paths, which is correct
and scores 1: choosing parental columns marker by marker; keeping the
placeholder's fixed guess and recovering paths against it; counting changed
homologs with set rather than multiset intersection; omitting the non-repeated
double reduction term; a tightened, non-admissible pruning bound; pruning
branches that only tie the incumbent; keeping the first optimum found rather
than the row-major smallest, with siblings visited in either order; recovering
paths by backward traceback; settling both parents marker by marker instead of
parent A across all markers first; skipping canonical form, sorting rows
without the path-signature rule, relabelling both parents with one
permutation, and applying the permutation in the wrong direction — each of the
last four both as written and after a score-preserving relabelling of the
search's output, which is what a search without symmetry reduction produces;
recovering lex-min paths before rather than after canonical row order; exact
floating equality where the tolerance is required; and returning the visible
cross's answer regardless of input. Every variant that produces a wrong
reconstruction on any fixture scores 0. Two mutations turn out to produce the
required answer on every fixture — penalising a forbidden double reduction
instead of forbidding it, and sorting rows without the signature rule when the
search already emits canonical rows and lex-min paths — and are reported as
such rather than counted; they are not wrong answers on this corpus. Three
mutations are masked only when the search already emits canonical output and
become wrong answers as soon as it does not, which is why they are measured in
both forms. Variants that also drop the homolog symmetry reduction run several
hundred times slower and some of their probe jobs reach the per-job budget,
so their failures combine a wrong answer with a missing artifact; the
relabelling form isolates the semantics without that cost.

Exploit controls were run against the untouched project with hostile artefacts
added one at a time, and the reward stayed 0 in every case: a reward file
pre-written to 1; a candidate `Cargo.toml` and `build.rs` that write a reward;
a solver that prints the pass marker and exits successfully; a result document
carrying the certified structure with a forged score, and one with a forged
digest; a candidate source replaced by a symlink into the verifier tree, and a
symlink planted under `src/solver/`; a candidate that does not compile; a
malformed result document; and a solver that never returns, which the per-job
timeout ends.

Time is verifier-owned and the run fails closed. A probe job may use up to
three hundred seconds; the probe phase as a whole must end within fifteen
hundred seconds of verifier start; and the candidate-linked build has its own
budget. The first job to exhaust its budget, or the phase deadline arriving,
stops all further candidate execution: the judge grades whatever artifacts
were captured, every check that wanted a missing artifact fails with that
reason, and the reward is held at 0 whatever the judge reports. Fewer
artifacts can only fail more checks, so failing closed never helps a
candidate. A solver that never returns therefore produces a normal verifier
completion with reward 0 after one probe budget, measured at about three
hundred seconds end to end, well inside the verifier's envelope. The
reference solves every fixture in under a second, so the per-job budget is
not a constraint on a correct search.
"""

